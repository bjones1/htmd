[package]
name = "htmd-playground"
description = "The htmd playground's user interface."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
htmd-playground-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen.workspace = true
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "DocumentFragment",
    "DomParser",
    "Element",
    "FocusEvent",
    "History",
    "HtmlDocument",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlIFrameElement",
    "HtmlInputElement",
    "HtmlTemplateElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Node",
    "NodeList",
    "Performance",
    "SupportedType",
    "Window",
] }
