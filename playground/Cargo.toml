# The playground is its own workspace, so that the htmd library's build, lint,
# and tests (run from the repository root) never see it, and `cargo package`
# for htmd skips this directory.
[workspace]
resolver = "3"
members = ["core", "engine", "app"]
# The app only builds for wasm32; `cargo test` here covers the other two.
default-members = ["core", "engine"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
htmd-playground-core = { path = "core" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
