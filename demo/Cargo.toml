[package]
name = "htmd-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1"
htmd = { path = "../" }
html5ever = "0.39"
js-sys = "0.3.107"
leptos = { version = "0.8", features = ["csr"] }
markup5ever_rcdom = "0.39"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Same version tachys uses, so only one copy is linked into the wasm.
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlIFrameElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Storage",
    "StorageEvent",
    "Window",
    "console",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
