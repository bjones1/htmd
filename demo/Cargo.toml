[package]
name = "htmd-demo"
version = "0.1.0"
edition = "2024"

[features]
# FR-7:148 / Deliverable 3: opt-in toolbar panic button used to verify
# the crash overlay in debug and release builds; compiled out of the
# shipped Pages build.
demo-panic-test = []

[dependencies]
console_error_panic_hook = "0.1"
htmd = { path = "../" }
html5ever = "0.39"
js-sys = "0.3.107"
leptos = { version = "0.8", features = ["csr"] }
markup5ever_rcdom = "0.39"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Same version tachys uses, so only one copy is linked into the wasm.
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlIFrameElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Performance",
    "Storage",
    "StorageEvent",
    "Window",
    "console",
] }

# Must track the wasm-bindgen pin above: 0.3.80 is the release built
# against wasm-bindgen 0.2.130, and wasm-bindgen-test-runner (installed
# by CI) must be that same 0.2.130.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
