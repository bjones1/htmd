# Builds the playground (playground/) and publishes it to GitHub Pages on
# every push to main. Pages must be set to deploy from GitHub Actions in the
# repository settings. The library's own CI is ci.yaml, which this does not
# touch.
name: Playground

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add clippy

      - name: Install wasm-bindgen-cli at the locked version
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- --deny warnings
          cargo clippy --locked --target wasm32-unknown-unknown -p htmd-playground -p htmd-playground-engine -- --deny warnings

      - name: Build
        run: ./build.sh

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: playground/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
